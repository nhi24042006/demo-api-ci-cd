name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai dat Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Dang nhap Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chay kich ban Monitor
        run: |
          postman collection run "59052108-a4dd6da0-da99-4776-a4ae-1e465cb0f1cc"
